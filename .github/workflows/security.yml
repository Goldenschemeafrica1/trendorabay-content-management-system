name: Security Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run security audit every Monday at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  security-audit:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        directory: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ./${{ matrix.directory }}
        run: npm ci
      
      - name: Run npm audit
        working-directory: ./${{ matrix.directory }}
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Check for outdated packages
        working-directory: ./${{ matrix.directory }}
        run: npm outdated
        continue-on-error: true
      
      - name: Install npm-check-updates
        run: npm install -g npm-check-updates
      
      - name: Check for major updates
        working-directory: ./${{ matrix.directory }}
        run: ncu
        continue-on-error: true
      
      - name: Run SAST with ESLint
        working-directory: ./${{ matrix.directory }}
        run: npm run lint || true
        continue-on-error: true
      
      - name: Run security scan script
        run: ./scripts/security-scan.sh
        continue-on-error: true
      
      - name: Create security report
        if: always()
        run: |
          echo "## Security Audit Report for ${{ matrix.directory }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Audit Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cd ${{ matrix.directory }}
          npm audit --json || echo "No vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
